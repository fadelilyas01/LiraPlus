name: CI - LiraPlus Quality & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Analyse Statique & Respect des Standards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Flutter (Canal Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Résolution des dépendances
        run: flutter pub get

      - name: Vérification du formatage du code
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique approfondie (Zéro Erreur, Zéro Avertissement)
        run: flutter analyze --no-fatal-infos --fatal-warnings

  test-and-coverage:
    name: Suite de Tests Automatisés & Régression
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 15

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Flutter (Canal Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Résolution des dépendances
        run: flutter pub get

      - name: Exécution des tests automatisés & régression
        run: |
          set -o pipefail
          flutter test --coverage --reporter expanded 2>&1 | tee test_results.log

      - name: Diagnostic détaillé des tests en cas d'échec
        if: failure()
        run: |
          echo "=== DIAGNOSTIC DES TESTS EN ÉCHEC ==="
          grep -E "\[E\]|TestFailure|FAILED|EXCEPTION CAUGHT" test_results.log -A 25 -B 5 || true
          echo "=== DERNIÈRES LIGNES DU LOG ==="
          tail -n 80 test_results.log
          if [ -f test_results.log ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E "\[E\]|TestFailure" test_results.log || true)
          fi

      - name: Téléversement du rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-log
          path: test_results.log

  build-verification:
    name: Vérification de Compilabilité Mobile (Android)
    runs-on: ubuntu-latest
    needs: test-and-coverage
    timeout-minutes: 20

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration de Gradle avec cache
        uses: gradle/actions/setup-gradle@v3

      - name: Configuration de Flutter (Canal Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Résolution des dépendances
        run: flutter pub get

      - name: Acceptation des licences Android SDK
        run: yes | flutter doctor --android-licenses || true

      - name: Compilation de contrôle (APK Debug)
        run: flutter build apk --debug

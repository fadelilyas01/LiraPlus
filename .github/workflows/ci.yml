name: CI - LiraPlus Quality & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Analyse Statique & Respect des Standards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Flutter (Canal Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Résolution des dépendances
        run: flutter pub get

      - name: Vérification du formatage du code
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique approfondie (Zéro Avertissement)
        run: flutter analyze --fatal-infos --fatal-warnings

  test-and-coverage:
    name: Suite de Tests Automatisés & Régression
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 15

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Flutter (Canal Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Résolution des dépendances
        run: flutter pub get

      - name: Exécution des 38 tests unitaires & ergonomiques
        run: flutter test --coverage

  build-verification:
    name: Vérification de Compilabilité Mobile (Android)
    runs-on: ubuntu-latest
    needs: test-and-coverage
    timeout-minutes: 20

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration de Flutter (Canal Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Résolution des dépendances
        run: flutter pub get

      - name: Compilation de contrôle (APK Debug)
        run: flutter build apk --debug

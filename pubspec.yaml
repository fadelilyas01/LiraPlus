name: liraplus
description: "LiraPlus - Application mobile québécoise d'aide à la lecture inclusive et 100% hors ligne (MEQ, LSQ, Loi 25)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.0
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  provider: ^6.1.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
